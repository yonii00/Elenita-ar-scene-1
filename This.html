<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Elenita AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }

    #elenitaVideo {
      position: absolute;
      left: -9999px;
      width: 2px;
      height: 2px;
    }
  </style>
</head>

<body>

  <!-- Elenita animation -->
  <video
    id="elenitaVideo"
    src="./Elenita.mp4"
    preload="metadata"
    muted
    loop
    playsinline
    webkit-playsinline
  ></video>

  <!-- Working automatic MindAR setup -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <a-entity
      id="imageTarget"
      mindar-image-target="targetIndex: 0"
    >

      <!-- Initially hidden until video is ready -->
      <a-plane
        id="videoPlane"
        visible="false"
        width="1"
        height="0.5077"
        position="0 0 0.01"
        material="shader: flat; side: double"
      ></a-plane>

    </a-entity>

  </a-scene>

  <script>
    const scene = document.querySelector("a-scene");
    const target = document.getElementById("imageTarget");
    const plane = document.getElementById("videoPlane");
    const video = document.getElementById("elenitaVideo");

    let targetVisible = false;
    let textureReady = false;
    let lossTimer = null;

    // Attach the video texture only after playback begins.
    function attachVideoTexture() {
      if (textureReady || video.readyState < 2) {
        return;
      }

      const mesh = plane.getObject3D("mesh");

      if (!mesh) {
        console.warn("AR plane mesh not ready.");
        return;
      }

      const texture = new THREE.VideoTexture(video);

      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.generateMipmaps = false;

      mesh.material.dispose();

      mesh.material = new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.DoubleSide,
        toneMapped: false
      });

      textureReady = true;

      console.log("Elenita video texture attached.");
    }

    // Camera ready
    scene.addEventListener("arReady", () => {
      console.log("Elenita AR camera ready.");
    });

    scene.addEventListener("arError", event => {
      console.error("MindAR error:", event);
    });

    // Illustration detected
    target.addEventListener("targetFound", async () => {
      clearTimeout(lossTimer);
      targetVisible = true;

      try {
        await video.play();

        attachVideoTexture();

        if (textureReady && targetVisible) {
          plane.setAttribute("visible", true);
        }

        console.log("Elenita animation playing.");

      } catch (error) {
        console.error("Video playback error:", error);
      }
    });

    // Illustration lost
    target.addEventListener("targetLost", () => {
      targetVisible = false;
      clearTimeout(lossTimer);

      lossTimer = setTimeout(() => {
        if (!targetVisible) {
          video.pause();
          plane.setAttribute("visible", false);
        }
      }, 350);
    });

    video.addEventListener("error", () => {
      console.error("Elenita video error:", video.error);
    });
  </script>

</body>
</html>
